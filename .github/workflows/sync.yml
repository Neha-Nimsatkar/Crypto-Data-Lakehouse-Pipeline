name: Deploy and Run Crypto Lakehouse

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Authenticate and Update Databricks Git Folder
        uses: databricks/run-notebook@v0.0.2
        with:
          databricks-host: ${{ secrets.DATABRICKS_HOST }}
          databricks-token: ${{ secrets.DATABRICKS_TOKEN }}
          git-commit: ${{ github.sha }} 

      - name: Trigger Databricks Workflow Job
        run: |
          curl -X POST -H "Authorization: Bearer ${{ secrets.DATABRICKS_TOKEN }}" \
          -H "Content-Type: application/json" \
          https://${{ secrets.DATABRICKS_HOST }}/api/2.1/jobs/run-now \
          -d '{"job_id": 623792115993223}'