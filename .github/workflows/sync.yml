name: Databricks Code Deployment and Automated Execution Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Source Code
        uses: actions/checkout@v4

      - name: Setup Databricks Automation CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      # Pushing everything over to the cloud environment workspace path
      - name: Upload Workspace Directories to Databricks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks workspace import-dir ./batch_pipeline /Users/1492neha@gmail.com/batch_pipeline --overwrite

      # Fire the single controller orchestration manager script remotely on Databricks
      - name: Trigger Master Pipeline Sequence Remotely
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          # This is the modern official way to run workspace scripts directly in the cloud!
          databricks workspace execute /Users/1492neha@gmail.com/batch_pipeline/orchestrator.py
